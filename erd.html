<title>petManagement — DB ERD (main 브랜치 마이그레이션 기준)</title>
<style>
  :root {
    --border: #d8dde3;
    --bg-soft: #f7f9fb;
    --accent: #3a6ea5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    margin: 0;
    padding: 2rem;
    line-height: 1.6;
    color: #1f2937;
    background: #fff;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.15rem; margin-top: 2.5rem; border-left: 4px solid var(--accent); padding-left: 0.6rem; }
  .subtitle { color: #6b7280; margin-top: 0; margin-bottom: 1.5rem; font-size: 0.92rem; }
  .note {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1.1rem;
    font-size: 0.88rem;
    margin: 0.8rem 0 1.4rem;
  }
  .note ul { margin: 0.4rem 0 0; padding-left: 1.2rem; }
  .note li { margin-bottom: 0.25rem; }
  .erd-diagram {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    overflow-x: auto;
  }
  .erd-diagram svg { display: block; max-width: 100%; height: auto; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    font-size: 0.82rem;
    color: #4b5563;
    margin: 0.6rem 0 1rem;
  }
  .legend span.swatch {
    display: inline-block;
    width: 1.8rem;
    border-top: 1.4px solid #8a7fb8;
    vertical-align: middle;
    margin-right: 0.35rem;
  }
  .legend span.dashed { border-top-style: dashed; }
  .legend code.pk { color: #b45309; }
  .legend code.fk { color: #1d4ed8; }
  .legend code.uk { color: #047857; }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.85rem;
    margin-top: 0.6rem;
  }
  caption {
    caption-side: top;
    text-align: left;
    font-weight: 600;
    margin-bottom: 0.4rem;
    color: var(--accent);
  }
  th, td {
    border: 1px solid var(--border);
    padding: 0.4rem 0.6rem;
    text-align: left;
    vertical-align: top;
  }
  th { background: var(--bg-soft); font-weight: 600; }
  code { background: #eef2f6; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85em; }
  .pk { color: #b45309; font-weight: 600; }
  .fk { color: #1d4ed8; font-weight: 600; }
  .tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 1.4rem;
  }
  footer { margin-top: 3rem; font-size: 0.8rem; color: #9ca3af; }
</style>
</head>
<body>

<h2>ER 다이어그램</h2>
<p class="legend">
  <span><span class="swatch"></span>관계마다 선 색을 다르게 표시 — 시작점(●, FK 쪽)·끝점(○, PK 쪽)이 해당 컬럼 행(row)에 정확히 고정됨</span>
  <span><span class="swatch dashed"></span>점선 = nullable FK (예: notification_log.vaccination_record_id)</span>
  <span>● = FK(N)쪽, ○ = PK(1)쪽 — 같은 색 선을 따라가면 어떤 컬럼이 어떤 컬럼을 참조하는지 추적 가능</span>
  <span><code class="pk">PK</code> 기본키 · <code class="fk">FK</code> 외래키 · <code class="uk">UK</code> 유니크</span>
</p>
